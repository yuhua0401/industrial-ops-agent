services:

  # ── PostgreSQL 数据库 ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: equipment_cs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-equipment_cs}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-equipment_cs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── etcd（Milvus 元数据存储）─────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: equipment_cs_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  # ── MinIO（Milvus 对象存储）──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: equipment_cs_minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Milvus 向量数据库 ────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: equipment_cs_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Attu（Milvus 管理面板，仅调试时启动：docker-compose --profile debug up）─
  attu:
    image: zilliz/attu:v2.4.12
    container_name: equipment_cs_attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
      SERVER_PORT: "3000"
      TZ: Asia/Shanghai
    ports:
      - "30000:3000"
    depends_on:
      milvus:
        condition: service_healthy
    profiles:
      - debug

  # ── FastAPI 后端应用 ─────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: equipment_cs_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-equipment_cs}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # ── Nginx 反向代理 ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: equipment_cs_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
