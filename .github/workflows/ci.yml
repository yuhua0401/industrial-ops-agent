name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 测试全部离线（FakeLLM / mock DB / 内存 SQLite），占位配置即可
      - name: 生成占位配置
        run: cp deploy/.env.example .env.local

      - name: Lint（ruff）
        run: ruff check .

      - name: 测试（pytest）
        run: pytest tests/ -q
