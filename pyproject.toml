# ruff / mypy / pytest 配置
# 本文件为 CLAUDE.md 中宣称的 `ruff check .` / `mypy backend/` 提供配置基础。

[tool.ruff]
target-version = "py311"
line-length = 100
# 排除生成/无关目录
exclude = [
    "data/",
    "docs/",
    "deploy/",
    ".git",
    ".idea",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 允许未使用 import（模块 docstring 风格宽松）
ignore = ["F401"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# 宽松模式：当前仓库尚未全量类型标注，先保障可运行
ignore_missing_imports = true
check_untyped_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
