# ruff / mypy / pytest 配置
# 本文件为 CLAUDE.md 中宣称的 `ruff check .` / `mypy backend/` 提供配置基础。

[tool.ruff]
target-version = "py311"
line-length = 100
# 排除生成/无关目录
exclude = [
    "data/",
    "docs/",
    "deploy/",
    ".git",
    ".idea",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# F401 允许未使用 import（模块 docstring 风格宽松）
# E402 测试文件在 sys.path 引导后 import backend.*（与 tests/test_diagnosis.py 现有模式一致）
# B008 FastAPI 标准写法：Depends(...) 作为参数默认值（auth/knowledge/ticket 等均如此）
ignore = ["F401", "E402", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# 宽松模式：当前仓库尚未全量类型标注，先保障可运行
ignore_missing_imports = true
check_untyped_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
